<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOX APPS — игры, боты и каналы для Telegram</title>
<meta name="description" content="Игры, боты и каналы для Telegram в одном каталоге.">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="BOX APPS">
<meta property="og:description" content="Игры, боты и каналы для Telegram в одном каталоге.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Панель на бумаге: чёрный сайдбар, ячейки в чёрных рамках, острые углы, жирный капс, лайм как акцент. */
:root{
  --paper:#ECECE8; --card:#F6F6F3; --ink:#111111; --ink-2:#2A2A28; --muted:#6E6E69; --hair:#CFCFC9;
  --lime:#D6FF3B; --violet:#6D4CF6; --red:#C0322A; --b:1.5px solid var(--ink);
  --sans:"Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:500 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
::selection{background:var(--lime);color:var(--ink)}
svg{display:block}
img{max-width:100%;display:block}
.lbl{font:800 11px/1.2 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.sub{font-size:12px;color:var(--muted);font-weight:500}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none}

.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
@media (min-width:980px){.shell{grid-template-columns:232px minmax(0,1fr)}}
.side{display:none;background:var(--ink);color:#fff;padding:26px 0 18px;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
@media (min-width:980px){.side{display:flex}}
.logo{font:900 22px/1 var(--sans);letter-spacing:-.02em;text-transform:uppercase;padding:0 22px;display:flex;align-items:center;gap:8px}
.logo i{width:12px;height:12px;background:var(--lime);display:inline-block}
.menu{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.menu a{display:flex;align-items:center;gap:12px;padding:10px 12px;font:800 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:#E8E8E3}
.menu a:hover{background:#1f1f1e}
.menu a[aria-current="page"]{background:var(--lime);color:var(--ink)}
.menu .cnt{margin-left:auto;background:var(--violet);color:#fff;font:700 10px/1 var(--mono);padding:4px 6px}
.menu a[aria-current="page"] .cnt{background:var(--ink)}
.menu .sep{height:1px;background:#2b2b29;margin:10px 12px}
.promo{margin:auto 14px 0;border:1px solid #3a3a38;padding:16px;display:flex;flex-direction:column;gap:8px}
.promo p{margin:0;font-size:12px;color:#B5B5AE}
.btn-lime{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--lime);color:var(--ink);border:0;padding:10px 14px;font:800 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;align-self:flex-start}

.mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:5}
@media (min-width:980px){.mtop{display:none}}
.mtop .logo{padding:0;font-size:19px}
.mtabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--ink);border-top:1px solid #2b2b29;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));position:sticky;top:calc(51px + env(safe-area-inset-top,0px));z-index:4}
@media (min-width:980px){.mtabs{display:none}}
.mtabs a{flex:none;padding:11px 12px;font:800 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:#BDBDB6}
.mtabs a[aria-current="page"]{color:var(--ink);background:var(--lime)}

.main{min-width:0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:980px){.main{padding:22px 24px 32px}}
.frame{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border:var(--b);min-width:0}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:var(--b);flex-wrap:wrap}
.box-f{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:var(--b);font:800 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.box-f:hover{background:var(--lime)}

.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:18px;border:var(--b);background:var(--card)}
.hello h1{margin:0;font:900 clamp(28px,6vw,44px)/.95 var(--sans);letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hello h1 .tag{background:var(--lime);padding:0 8px}
.hello p{margin:6px 0 0;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:8px;border:var(--b);padding:8px 12px;font:800 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;background:var(--card);cursor:pointer}
.chip.dark{background:var(--ink);color:#fff}
.chip.lime{background:var(--lime)}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:14px;display:flex;flex-direction:column;gap:10px}
.stat .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.stat b{font:900 clamp(30px,6vw,42px)/1 var(--sans);letter-spacing:-.03em}
.stat .delta{font:800 10.5px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat.hot{background:var(--lime)}
.stat.hot .delta{color:var(--ink)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:860px){.grid2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.pick{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:620px){.pick{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pick-b{padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.pick-b h2{margin:0;font:900 clamp(26px,5vw,36px)/.95 var(--sans);text-transform:uppercase;letter-spacing:-.02em;overflow-wrap:anywhere}
.stars{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.stars i{font-style:normal;letter-spacing:1px}
.price{font:900 24px/1 var(--sans);letter-spacing:-.02em}

.cover{position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden;background:radial-gradient(rgba(17,17,17,.22) 1.1px,transparent 1.3px) 0 0/7px 7px, #DCDCD6;border-right:var(--b)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.15) contrast(1.05)}
.cover b{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font:900 clamp(120px,30vw,220px)/1 var(--sans);letter-spacing:-.06em;color:var(--ink);text-transform:uppercase}
.cover .badge{position:absolute;left:12px;top:12px;background:var(--ink);color:#fff;padding:6px 8px;font:800 10.5px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;z-index:1}
.cover .badge.lime{background:var(--lime);color:var(--ink)}
@media (max-width:619px){.pick .cover{border-right:0;border-bottom:var(--b);aspect-ratio:16/10}}

.feed{list-style:none;margin:0;padding:6px 14px}
.feed li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.feed li:last-child{border-bottom:0}
.sq{width:32px;height:32px;display:grid;place-items:center;background:var(--ink);color:#fff;font:800 12px/1 var(--sans);overflow:hidden;flex:none}
.sq img{width:100%;height:100%;object-fit:cover}
.sq.lime{background:var(--lime);color:var(--ink);border:var(--b)}
.sq.violet{background:var(--violet)}
.feed strong{font-size:12.5px;font-weight:800;display:block;line-height:1.2}
.feed div span{font-size:11.5px;color:var(--muted)}
.feed time{font-size:11px;color:var(--muted)}

.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:var(--b);background:var(--card)}
.tabs button{border:0;background:none;padding:13px 6px;font:900 13px/1 var(--sans);letter-spacing:.02em;text-transform:uppercase;cursor:pointer}
.tabs button+button{border-left:var(--b)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs sup{font:700 10px/1 var(--mono);margin-left:4px;vertical-align:top}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 100%;min-width:0}
@media (max-width:700px){.chiprow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 2px}.chiprow::-webkit-scrollbar{display:none}.chiprow .cat{flex:none}}
.cat{border:var(--b);background:var(--card);padding:8px 11px;font:800 11px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.cat[aria-pressed="true"]{background:var(--lime)}
.find{display:flex;align-items:center;gap:8px;border:var(--b);background:var(--card);padding:0 12px;flex:1 1 200px;min-width:0;height:35px}
.find input{border:0;background:none;outline:none;width:100%;min-width:0;font:700 12px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em}
.find input::placeholder{color:var(--muted)}

.tbl{width:100%;border-collapse:collapse}
.tbl th{font:800 10.5px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:12px 14px;border-bottom:var(--b)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr[data-id]{cursor:pointer}
.tbl tbody tr[data-id]:hover td{background:#EEF7C9}
.tbl .name{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13.5px;min-width:0}
.tbl .name small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;font:700 12px/1 var(--mono)}
.bar span{display:block;width:72px;height:6px;background:var(--hair)}
.bar span i{display:block;height:100%;background:var(--ink)}
.tbl .go{text-align:right;font-size:16px}
.hide-s{display:none}
@media (min-width:640px){.hide-s{display:table-cell}}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
.blank{padding:34px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.blank h2{margin:0;font:900 clamp(26px,5vw,36px)/.95 var(--sans);text-transform:uppercase;letter-spacing:-.02em}

.cats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.cats-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cats-grid a{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:16px 14px;min-height:92px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.cats-grid a:hover{background:var(--lime)}
.cats-grid b{font:900 17px/1.05 var(--sans);text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:anywhere}
.cats-grid span{font:700 12px/1 var(--mono);color:var(--muted)}

.prod{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.prod{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:759px){.prod .cover{border-right:0;border-bottom:var(--b);aspect-ratio:4/3}}
.prod-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.prod-b h1{margin:0;font:900 clamp(30px,6vw,46px)/.92 var(--sans);text-transform:uppercase;letter-spacing:-.02em;overflow-wrap:anywhere}
.prod-b .desc{margin:0;font-size:14px;line-height:1.55;max-width:56ch;white-space:pre-line}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:var(--b)}
.kv div{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;border-top:var(--b)}
.kv div:nth-child(-n+2){border-top:0}
.kv div:nth-child(even){border-left:var(--b)}
.kv div:last-child:nth-child(odd){grid-column:1/-1}
.kv b{font:900 16px/1.1 var(--sans);text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:anywhere}
.note{border-left:4px solid var(--lime);background:var(--ink);color:#fff;padding:12px 14px;font-size:13.5px}
.note .lbl{color:var(--lime);display:block;margin-bottom:4px}
.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 16px;border:var(--b);background:var(--card);font:900 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.btn.dark{background:var(--ink);color:#fff;justify-content:space-between}
.btn.dark:hover{background:var(--ink-2)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn[aria-disabled="true"],.btn:disabled{background:var(--hair);border-color:var(--hair);color:var(--muted);cursor:default}

.chart{position:relative;padding:8px 14px 12px}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{font:600 13px var(--sans);fill:var(--ink)}
.chart .gl{stroke:var(--hair);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--card);border:var(--b);padding:6px 9px;font:800 12px/1.2 var(--sans);transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;opacity:0}
.tip small{display:block;font-weight:600;font-size:10px;color:var(--muted)}

/* формы */
.form{display:flex;flex-direction:column}
.cells{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:var(--b);margin:14px}
.cell{display:flex;flex-direction:column;gap:6px;padding:10px 12px;min-width:0;border-top:var(--b)}
.cell:nth-child(-n+2){border-top:0}
.cell:nth-child(even){border-left:var(--b)}
.cell.full{grid-column:1/-1;border-left:0!important}
.cell.full:nth-child(-n+2){border-top:0}
.cell label,.cell .lab{font:800 10px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cell input,.cell select,.cell textarea{border:0;background:none;outline:none;padding:0;font:900 16px/1.25 var(--sans);letter-spacing:-.01em;width:100%;min-width:0;border-radius:0}
.cell textarea{font-weight:600;font-size:14px;min-height:72px;resize:vertical}
.cell input::placeholder,.cell textarea::placeholder{color:#A5A59F}
.cell small{font-size:11px;color:var(--muted)}
@media (max-width:560px){.cells{grid-template-columns:minmax(0,1fr)}.cell:nth-child(even){border-left:0}.cell:nth-child(2){border-top:var(--b)}}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;border:var(--b);padding:7px 10px;font:800 11px/1 var(--sans);letter-spacing:.03em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks label:has(input:checked){background:var(--lime)}
.tog{display:flex;gap:10px;align-items:center;font-weight:700;font-size:13px;cursor:pointer}
.tog input{appearance:none;flex:none;width:18px;height:18px;border:var(--b);background:var(--card);margin:0;display:grid;place-items:center;cursor:pointer}
.tog input:checked{background:var(--lime)}
.tog input:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.submit{margin:0 14px 14px;height:52px;border:0;background:var(--ink);color:#fff;font:900 13px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.submit:hover{background:var(--ink-2)}
.submit:disabled{background:var(--muted)}
.msg{margin:0 14px 12px;font-weight:700;font-size:12.5px;color:var(--red)}
.msg.ok{color:var(--ink);background:var(--lime);padding:8px 10px;display:inline-block}
.upl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upl .thumb{width:84px;height:84px;border:var(--b);background:radial-gradient(rgba(17,17,17,.22) 1px,transparent 1.2px) 0 0/6px 6px,#DCDCD6;overflow:hidden;display:grid;place-items:center;font:900 34px/1 var(--sans)}
.upl .thumb img{width:100%;height:100%;object-fit:cover}

/* админка */
.adm-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font:700 10px/1 var(--mono);padding:3px 5px;border:1px solid currentColor;text-transform:uppercase;margin-left:6px;vertical-align:middle}
.pill.feat{background:var(--lime);border-color:var(--ink)}
.pill.off{color:var(--muted)}
.row-act{display:flex;gap:6px;justify-content:flex-end}
.row-act button{border:var(--b);background:var(--card);padding:7px 9px;font:800 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.row-act button.del{border-color:var(--red);color:var(--red)}
.row-act button.del.sure{background:var(--red);color:#fff}
.cat-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:14px}
@media (min-width:860px){.cat-cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat-col{border:var(--b);display:flex;flex-direction:column}
.cat-col h3{margin:0;padding:10px 12px;border-bottom:var(--b);font:900 13px/1 var(--sans);text-transform:uppercase}
.cat-line{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--hair)}
.cat-line input{flex:1;min-width:0;border:0;background:none;outline:none;font:800 13px/1.3 var(--sans);text-transform:uppercase;padding:6px 4px}
.cat-line input:focus{background:#EEF7C9}
.cat-line button{border:0;background:none;cursor:pointer;font-size:16px;padding:4px 6px;color:var(--muted)}
.cat-line button:hover{color:var(--red)}
.cat-add{display:flex;gap:6px;padding:8px}
.cat-add input{flex:1;min-width:0;border:var(--b);background:var(--card);padding:8px;font:700 12px/1 var(--sans);text-transform:uppercase}
.cat-add button{border:0;background:var(--ink);color:#fff;padding:0 12px;font:800 11px/1 var(--sans);text-transform:uppercase;cursor:pointer}
.pend{list-style:none;margin:0;padding:0}
.pend li{padding:14px;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.pend li:last-child{border-bottom:0}
.pend p{margin:0;font-size:13px;white-space:pre-line}

.loading{padding:80px 0;text-align:center;font:900 22px/1 var(--sans);text-transform:uppercase}
.in{animation:in .35s ease-out both}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="logo" href="#"><i></i>BOX APPS</a>
    <nav class="menu" aria-label="Разделы">
      <a href="#" data-nav=""><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="5.5" height="5.5"/><rect x="11.5" y="3" width="5.5" height="5.5"/><rect x="3" y="11.5" width="5.5" height="5.5"/><rect x="11.5" y="11.5" width="5.5" height="5.5"/></svg>Обзор</a>
      <a href="#games" data-nav="games"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="16" height="9" rx="1"/><path d="M6 9v3M4.5 10.5h3M13 10h.01M15 11.5h.01"/></svg>Игры<span class="cnt" data-cnt="game"></span></a>
      <a href="#bots" data-nav="bots"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="12" height="10"/><path d="M10 3v3M7.5 10.5h.01M12.5 10.5h.01M8 13.5h4"/></svg>Боты<span class="cnt" data-cnt="bot"></span></a>
      <a href="#channels" data-nav="channels"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8v4l9 4V4zM12 7h3a2 2 0 010 4h-3"/></svg>Каналы<span class="cnt" data-cnt="channel"></span></a>
      <a href="#categories" data-nav="categories"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h14M3 10h14M3 15h9"/></svg>Категории</a>
      <a href="#submit" data-nav="submit"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4v12M4 10h12"/></svg>Предложить</a>
      <div class="sep admin-only" hidden></div>
      <a href="#admin" data-nav="admin" class="admin-only" hidden><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2.5M10 15v2.5M2.5 10H5M15 10h2.5M4.7 4.7l1.8 1.8M13.5 13.5l1.8 1.8M4.7 15.3l1.8-1.8M13.5 6.5l1.8-1.8"/></svg>Админка<span class="cnt" id="c-pend" hidden></span></a>
    </nav>
    <div class="promo">
      <span class="lbl">Разработчикам</span>
      <p>Добавьте свою игру, бота или канал в каталог.</p>
      <a class="btn-lime" href="#submit">Подать заявку →</a>
    </div>
  </aside>

  <div style="min-width:0">
    <header class="mtop"><a class="logo" href="#"><i></i>BOX APPS</a><a class="btn-lime" href="#submit" style="padding:8px 10px">+ Проект</a></header>
    <nav class="mtabs" aria-label="Разделы">
      <a href="#" data-nav="">Обзор</a><a href="#games" data-nav="games">Игры</a><a href="#bots" data-nav="bots">Боты</a><a href="#channels" data-nav="channels">Каналы</a><a href="#categories" data-nav="categories">Категории</a><a href="#submit" data-nav="submit">Предложить</a><a href="#admin" data-nav="admin" class="admin-only" hidden>Админка</a>
    </nav>
    <main class="main"><div class="frame" id="app"><div class="loading">BOX APPS</div></div></main>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#111111'); tg.setBackgroundColor('#ECECE8'); } catch (e) {} }

const KIND_HASH = { game: 'games', bot: 'bots', channel: 'channels' };
const HASH_KIND = { games: 'game', bots: 'bot', channels: 'channel' };
const S = { data: null, kind: 'game', cat: 'all', q: '', admin: false, adm: { items: [], pending: [], tab: 'items' } };
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kindName = k => ({ game: 'Игра', bot: 'Бот', channel: 'Канал' }[k] || k);
const kindsName = k => ({ game: 'Игры', bot: 'Боты', channel: 'Каналы' }[k] || k);
const openLabel = k => ({ game: 'Играть', bot: 'Открыть бота', channel: 'Перейти в канал' }[k]);
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const ARROW = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11L11 3M5 3h6v6"/></svg>';
const RARROW = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 8h11M9 4l4 4-4 4"/></svg>';
const glyph = x => esc((String(x.title || '').replace(/[«»"]/g, '').trim()[0] || '·'));
const sq = (x, i) => x.image ? `<span class="sq"><img src="${esc(x.image)}" alt="" loading="lazy"></span>` : `<span class="sq ${['', 'lime', 'violet'][i % 3]}">${glyph(x)}</span>`;
const coverHTML = x => x.image ? `<img src="${esc(x.image)}" alt="">` : `<b>${glyph(x)}</b>`;
const starsOf = r => { const n = Math.round(r || 0); return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); };
const byRating = arr => [...arr].sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.createdAt || 0) - (a.createdAt || 0));

/* ---------- запросы ---------- */
function authHeaders() {
  const h = {};
  if (tg && tg.initData) h['x-tg-init-data'] = tg.initData;
  try { const k = localStorage.getItem('boxapps-admin-key'); if (k) h['x-admin-key'] = k; } catch (e) {}
  return h;
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.body && !(opts.body instanceof Blob) ? { 'content-type': 'application/json' } : {}), ...authHeaders(), ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({ ok: false, error: 'Сервер не ответил' }));
  if (!r.ok && j.ok !== false) j.ok = false;
  return j;
}
async function reloadCatalog() { S.data = await (await fetch('/api/catalog', { cache: 'no-store' })).json(); counts(); }
function counts() {
  document.querySelectorAll('[data-cnt]').forEach(el => { const n = S.data.items.filter(x => x.kind === el.dataset.cnt).length; el.textContent = n; el.hidden = !n; });
}

/* ---------- общие куски ---------- */
function rowsHTML(list) {
  if (!list.length) return `<tr><td colspan="4" class="empty">Здесь пока пусто.</td></tr>`;
  return list.map((x, i) => `<tr data-id="${x.id}">
    <td><div class="name">${sq(x, i)}<div style="min-width:0">${esc(x.title)}<small>${kindName(x.kind)} · ${esc(x.categories.join(' · '))}</small></div></div></td>
    <td class="hide-s">${x.rating ? `<div class="bar"><span><i style="width:${x.rating / 5 * 100}%"></i></span>${Number(x.rating).toFixed(1)}</div>` : '<span class="sub">—</span>'}</td>
    <td class="hide-s mono" style="font-size:12px">${x.kind === 'channel' ? esc(x.subscribers || '—') : (x.votes || '—')}</td>
    <td class="go">→</td></tr>`).join('');
}
const tableHead = `<thead><tr><th>Проект</th><th class="hide-s">Оценка</th><th class="hide-s">Голосов / подписчиков</th><th></th></tr></thead>`;
function bindRows() { app.querySelectorAll('tr[data-id]').forEach(r => r.onclick = () => { haptic(); location.hash = 'item-' + r.dataset.id; }); }

function emptyCatalog() {
  return `<section class="box blank in"><span class="sq lime">+</span><h2>Каталог наполняется</h2><p class="sub" style="margin:0">Скоро здесь появятся игры, боты и каналы.</p>
    ${S.admin ? `<a class="btn dark" href="#admin-new" style="gap:14px">Добавить первый проект ${RARROW}</a>` : `<a class="chip" href="#submit">Предложить проект ${ARROW}</a>`}</section>`;
}

/* ---------- обзор ---------- */
function overview() {
  const all = S.data.items;
  const n = k => all.filter(x => x.kind === k).length;
  const h = new Date().getHours();
  const hi = h < 6 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
  const head = `
  <section class="hello in">
    <div><h1>${hi}! <span class="tag">Что откроем?</span></h1><p>Игры, боты и каналы для Telegram в одном каталоге.</p></div>
    <a class="chip" href="#categories">Категории ${ARROW}</a>
  </section>
  <div class="stats">
    <a class="box stat" href="#games"><div class="top"><span class="lbl">Игры</span>${ARROW}</div><b>${n('game')}</b><span class="delta">${S.data.categories.game.length} категорий</span></a>
    <a class="box stat" href="#bots"><div class="top"><span class="lbl">Боты</span>${ARROW}</div><b>${n('bot')}</b><span class="delta">${S.data.categories.bot.length} категорий</span></a>
    <a class="box stat" href="#channels"><div class="top"><span class="lbl">Каналы</span>${ARROW}</div><b>${n('channel')}</b><span class="delta">${S.data.categories.channel.length} категорий</span></a>
    <a class="box stat hot" href="#categories"><div class="top"><span class="lbl">Всего</span>${ARROW}</div><b>${all.length}</b><span class="delta">в каталоге</span></a>
  </div>`;
  if (!all.length) { app.innerHTML = head + emptyCatalog(); return; }
  const pick = all.find(x => x.featured);
  const fresh = [...all].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 5);
  const top = byRating(all).slice(0, 6);
  app.innerHTML = head + `
  <div class="grid2">
    ${pick ? `<a class="box pick" href="#item-${pick.id}">
      <div class="cover">${coverHTML(pick)}<span class="badge lime">Выбор редакции</span></div>
      <div class="pick-b">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="lbl" style="color:var(--muted)">${kindName(pick.kind)} · ${esc(pick.categories.join(' · '))}</span>
          <h2>${esc(pick.title)}</h2>
          ${pick.rating ? `<div class="stars"><i>${starsOf(pick.rating)}</i>${pick.rating} ${pick.votes ? `(${pick.votes})` : ''}</div>` : ''}
          <p class="sub" style="margin:0;color:var(--ink)">${esc(pick.note || pick.description || '')}</p>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span class="price">${esc(pick.price || '')}</span><span class="btn dark" style="height:40px;gap:14px">Открыть ${RARROW}</span>
        </div>
      </div>
    </a>` : `<section class="box"><div class="box-h"><span class="lbl">Топ</span></div><div style="overflow-x:auto"><table class="tbl"><tbody>${rowsHTML(top.slice(0, 4))}</tbody></table></div></section>`}
    <section class="box">
      <div class="box-h"><span class="lbl">Новое в каталоге</span></div>
      <ul class="feed">${fresh.map((x, i) => `<li data-go="${x.id}" style="cursor:pointer">${sq(x, i)}<div><strong>${esc(x.title)}</strong><span>${kindName(x.kind)} · ${esc(x.categories[0])}</span></div><time>${x.rating || ''}</time></li>`).join('')}</ul>
    </section>
  </div>
  <section class="box">
    <div class="box-h"><span class="lbl">Топ проектов</span><span class="sub">по оценкам</span></div>
    <div style="overflow-x:auto"><table class="tbl">${tableHead}<tbody>${rowsHTML(top)}</tbody></table></div>
    <a class="box-f" href="#games">Смотреть все <span>→</span></a>
  </section>`;
  bindRows();
  app.querySelectorAll('[data-go]').forEach(l => l.onclick = () => location.hash = 'item-' + l.dataset.go);
}

/* ---------- разделы ---------- */
function listView(kind) {
  const all = S.data.items;
  const q = S.q.trim().toLowerCase();
  let list = all.filter(x => x.kind === kind);
  if (S.cat !== 'all') list = list.filter(x => x.categories.includes(S.cat));
  if (q) list = all.filter(x => (x.title + ' ' + (x.description || '')).toLowerCase().includes(q));
  list = byRating(list);
  const n = k => all.filter(x => x.kind === k).length;
  app.innerHTML = `
  <section class="hello in"><div><h1>${kindsName(kind)} <span class="tag">${n(kind)}</span></h1></div></section>
  <div class="tabs" role="group" aria-label="Раздел">${['game', 'bot', 'channel'].map(k => `<button data-k="${k}" aria-pressed="${kind === k}">${kindsName(k)}<sup>${n(k)}</sup></button>`).join('')}</div>
  <div class="tools">
    <div class="chiprow" role="group" aria-label="Категории"><button class="cat" data-cat="all" aria-pressed="${S.cat === 'all'}">Все</button>
    ${S.data.categories[kind].map(c => `<button class="cat" data-cat="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join('')}</div>
    <label class="find"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input id="q" type="search" placeholder="Поиск по названию" value="${esc(S.q)}" autocomplete="off"></label>
  </div>
  <section class="box">
    <div class="box-h"><span class="lbl">${q ? 'Результаты поиска' : (S.cat === 'all' ? 'Все ' + kindsName(kind).toLowerCase() : esc(S.cat))}</span><span class="sub mono">${list.length}</span></div>
    <div style="overflow-x:auto"><table class="tbl">${tableHead}<tbody>${rowsHTML(list)}</tbody></table></div>
  </section>`;
  bindRows();
  const act = app.querySelector('.chiprow [aria-pressed="true"]'); if (act && S.cat !== 'all') act.scrollIntoView({ inline: 'center', block: 'nearest' });
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { haptic(); S.q = ''; S.cat = 'all'; location.hash = KIND_HASH[b.dataset.k]; });
  app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; haptic(); listView(kind); });
  const qi = app.querySelector('#q');
  qi.oninput = () => { S.q = qi.value; const p = qi.selectionStart; listView(kind); const n2 = app.querySelector('#q'); n2.focus(); n2.setSelectionRange(p, p); };
}

function categoriesView() {
  const all = S.data.items;
  app.innerHTML = `<section class="hello in"><div><h1>Категории</h1><p>Игры, боты и каналы по темам.</p></div></section>` +
    ['game', 'bot', 'channel'].map(k => `<section class="box">
      <div class="box-h"><span class="lbl">${kindsName(k)}</span><a class="chip" href="#${KIND_HASH[k]}" style="padding:6px 9px">Все ${ARROW}</a></div>
      <div class="cats-grid">${S.data.categories[k].map(c => `<a href="#${KIND_HASH[k]}" data-k="${k}" data-c="${esc(c)}"><b>${esc(c)}</b><span>${all.filter(x => x.kind === k && x.categories.includes(c)).length}</span></a>`).join('')}</div>
    </section>`).join('');
  app.querySelectorAll('[data-c]').forEach(a => a.onclick = () => { S.cat = a.dataset.c; S.q = ''; haptic(); });
}

/* ---------- страница проекта ---------- */
const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
function chartHTML(week) {
  const W = 560, H = 220, m = { l: 40, r: 10, t: 14, b: 26 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(10, Math.ceil(Math.max(...week) * 1.15 / 10) * 10);
  const x = i => m.l + i / 6 * iw, y = v => m.t + ih - v / max * ih;
  const pts = week.map((v, i) => [x(i), y(v)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < 7; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const ticks = [0, .5, 1].map(f => Math.round(max * f));
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Игроки по дням">
    <defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".9" fill="#111"/></pattern></defs>
    ${ticks.map(t => `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${t >= 1000 ? (t / 1000).toFixed(1).replace('.0', '') + 'k' : t}</text>`).join('')}
    ${DAYS.map((dd, i) => `<text x="${x(i)}" y="${H - 4}" text-anchor="middle">${dd}</text>`).join('')}
    <path d="${d} L${x(6)},${m.t + ih} L${m.l},${m.t + ih}Z" fill="url(#dots)" opacity=".55"/>
    <path d="${d}" fill="none" stroke="#111" stroke-width="2.5"/>
    <line id="cx" y1="${m.t}" y2="${m.t + ih}" stroke="#111" stroke-dasharray="3 3"/>
    <circle id="cd" r="6" fill="#111" stroke="#F6F6F3" stroke-width="2.5"/>
    <rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>
  </svg><div class="tip" id="tip"></div></div>`;
}
function bindChart(week) {
  const host = app.querySelector('.chart'); if (!host) return;
  const svg = host.querySelector('svg'), tip = host.querySelector('#tip'), cx = host.querySelector('#cx'), cd = host.querySelector('#cd');
  const W = 560, H = 220, m = { l: 40, r: 10, t: 14, b: 26 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(10, Math.ceil(Math.max(...week) * 1.15 / 10) * 10);
  const full = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
  const show = i => {
    const r = svg.getBoundingClientRect(), X = m.l + i / 6 * iw, Y = m.t + ih - week[i] / max * ih;
    cx.setAttribute('x1', X); cx.setAttribute('x2', X); cd.setAttribute('cx', X); cd.setAttribute('cy', Y);
    tip.innerHTML = `${week[i].toLocaleString('ru-RU')} игроков<small>${full[i]}</small>`;
    tip.style.left = (14 + X / W * r.width) + 'px'; tip.style.top = (8 + Y / H * r.height) + 'px'; tip.style.opacity = 1;
  };
  show(week.indexOf(Math.max(...week)));
  host.querySelector('#hit').addEventListener('pointermove', e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W; show(Math.max(0, Math.min(6, Math.round((px - m.l) / iw * 6)))); });
}

function item(id) {
  const x = S.data.items.find(i => i.id === id);
  if (!x) { app.innerHTML = `<section class="hello"><div><h1>Не найдено</h1><p>Такого проекта нет в каталоге.</p></div><a class="chip" href="#">На главную</a></section>`; return; }
  const st = x.stats;
  const facts = [['Формат', kindName(x.kind)], ['Категория', x.categories.join(', ')]];
  if (x.session) facts.push(['Сессия', '~' + x.session]);
  if (x.subscribers) facts.push(['Подписчики', x.subscribers]);
  if (x.author) facts.push(['Автор', x.author]);
  if (x.price) facts.push(['Цена', x.price]);
  const similar = byRating(S.data.items.filter(y => y.id !== x.id && y.kind === x.kind)).slice(0, 4);
  app.innerHTML = `
  <div class="adm-bar"><button class="chip" id="back">← Назад</button>${S.admin ? `<a class="chip lime" href="#admin-edit-${x.id}">Редактировать</a>` : ''}</div>
  <section class="box prod in">
    <div class="cover">${coverHTML(x)}<span class="badge">${kindName(x.kind)}</span></div>
    <div class="prod-b">
      <span class="lbl" style="color:var(--muted)">${esc(x.categories.join(' · '))}</span>
      <h1>${esc(x.title)}</h1>
      ${x.rating ? `<div class="stars"><i>${starsOf(x.rating)}</i>${x.rating} ${x.votes ? `(${x.votes})` : ''}</div>` : ''}
      ${x.price ? `<span class="price">${esc(x.price)}</span>` : ''}
      ${x.description ? `<p class="desc">${esc(x.description)}</p>` : ''}
      ${x.note ? `<div class="note"><span class="lbl">От редакции</span>${esc(x.note)}</div>` : ''}
      <div class="kv">${facts.map(([k, v]) => `<div><span class="lbl" style="color:var(--muted)">${k}</span><b>${esc(v)}</b></div>`).join('')}</div>
      <div class="actions">
        <button class="btn" id="share">Поделиться</button>
        ${x.link ? `<a class="btn dark" href="${esc(x.link)}" target="_blank" rel="noopener" id="open">${openLabel(x.kind)} ${RARROW}</a>` : `<span class="btn" aria-disabled="true">Нет ссылки</span>`}
      </div>
      ${x.channel ? `<a class="chip" href="${esc(x.channel)}" target="_blank" rel="noopener" style="align-self:flex-start">Канал проекта ${ARROW}</a>` : ''}
    </div>
  </section>
  ${st ? `<div class="grid2">
    ${st.week ? `<section class="box"><div class="box-h"><span class="lbl">Игроки за неделю</span></div>${chartHTML(st.week)}</section>` : ''}
    <section class="box" ${st.week ? '' : 'style="grid-column:1/-1"'}>
      <div class="box-h"><span class="lbl">Показатели</span><span class="sub">30 дней</span></div>
      <ul class="feed">
        ${st.players ? `<li><span class="sq">И</span><div><strong>Игроков</strong><span>за месяц</span></div><b style="font-size:18px">${esc(st.players)}</b></li>` : ''}
        ${st.session ? `<li><span class="sq lime">С</span><div><strong>Средняя сессия</strong><span>мин:сек</span></div><b style="font-size:18px">${esc(st.session)}</b></li>` : ''}
        ${st.d7 ? `<li><span class="sq violet">В</span><div><strong>Вернулись</strong><span>на 7-й день</span></div><b style="font-size:18px">${esc(st.d7)}</b></li>` : ''}
      </ul>
    </section></div>` : ''}

function shrinkImage(file) {
  return new Promise((res, rej) => {
    if (file.type === 'image/gif') return res(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error('Не удалось обработать картинку')), 'image/jpeg', .86);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error('Это не картинка'));
    img.src = URL.createObjectURL(file);
  });
}

      if (!x.title.trim()) return fail('Укажите название');
      if (!x.link.trim()) return fail('Укажите ссылку');
      let j = await api('/api/admin/items', { method: 'POST', body: JSON.stringify({ ...x, prevId: src ? src.id : null }) });
      if (!j.ok) return fail(j.error || 'Не сохранилось');
      if (pendingFile) {
        const up = await api('/api/admin/upload?id=' + encodeURIComponent(j.item.id), { method: 'POST', body: pendingFile, headers: { 'content-type': pendingFile.type || 'image/jpeg' } });
        if (!up.ok) return fail('Проект сохранён, но обложка не загрузилась: ' + (up.error || ''));
        j = await api('/api/admin/items', { method: 'POST', body: JSON.stringify({ ...x, id: j.item.id, image: up.url, prevId: j.item.id }) });
      }
      await reloadCatalog(); await loadAdmin();
      location.hash = 'item-' + j.item.id;
    };
  };
  draw();
}

/* ---------- маршруты ---------- */
function route() {
  if (!S.data) return;
  const h = location.hash.slice(1);
  const nav = h.startsWith('item-') ? '' : h.startsWith('admin') ? 'admin' : h;
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === nav ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (h.startsWith('item-')) item(h.slice(5));
  else if (HASH_KIND[h]) { if (S.kind !== HASH_KIND[h]) { if (!S.keepCat) S.cat = 'all'; S.kind = HASH_KIND[h]; } listView(HASH_KIND[h]); }
  else if (h === 'categories') categoriesView();
  else if (h === 'submit') submit();
  else if (h === 'admin') adminView();
  else if (h === 'admin-new') adminEdit(null);
  else if (h.startsWith('admin-edit-')) adminEdit(h.slice(11));
  else overview();
  if (tg) { try { h ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
  window.scrollTo(0, 0);
}
// переход из «Категорий» сохраняет выбранную категорию
document.addEventListener('click', e => { const a = e.target.closest('[data-c]'); if (a) { S.kind = a.dataset.k; } }, true);

async function boot() {
  try { await reloadCatalog(); }
  catch (e) { app.innerHTML = `<div class="loading">Каталог не загрузился</div>`; return; }
  if (tg) { try { tg.BackButton.onClick(() => history.length > 1 ? history.back() : (location.hash = '')); } catch (e) {} }
  let hasKey = false; try { hasKey = Boolean(localStorage.getItem('boxapps-admin-key')); } catch (e) {}
  if (tg || hasKey) { try { const me = await api('/api/admin/me'); setAdmin(Boolean(me.admin)); if (me.admin) loadAdmin().catch(() => {}); } catch (e) {} }
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && !location.hash) location.hash = sp.startsWith('item-') ? sp : 'item-' + sp;
  route();
}
window.addEventListener('hashchange', route);
boot();
</script>
