<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOX APPS — игры и боты для Telegram</title>
<meta name="description" content="Игры и боты для Telegram, отобранные вручную. Без тапалок, казино, «заработка» и обязательных подписок.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="BOX APPS — игры и боты для Telegram">
<meta property="og:description" content="Отобранные вручную. Без фарма и мусора.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Белая бумага и чёрные чернила, как у bigunder.ru: Inter Tight капсом для всего крупного,
   Playfair курсивом для названий и цитат, IBM Plex Mono для мелких подписей. */
:root{
  --bg:#ffffff; --surface:#f2f2f0; --surface-2:#e7e7e4; --ink:#121212; --muted:#8e8e89; --pale:#cfcfcb; --line:#e7e7e4; --live:#2ecc40;
  --sans:"Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --serif:"Playfair Display", Didot, "Bodoni 72", Georgia, serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
::selection{background:var(--ink);color:var(--bg)}

.mono{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:400}
.muted{color:var(--muted)}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
.heavy{font-weight:800;text-transform:uppercase;letter-spacing:-.05em;line-height:.86}

/* шапка */
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:20px 14px}
.station{font-size:22px;font-weight:800;letter-spacing:-.05em;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--ink);border-radius:999px;font:500 12px/1 var(--mono);letter-spacing:.04em;white-space:nowrap}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--live);animation:blink 1.4s step-start infinite}
@keyframes blink{50%{background:var(--bg)}}
.nav{display:flex;gap:6px;padding-bottom:18px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:none;border:1px solid var(--ink);border-radius:999px;font:400 11px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.pill.soft{border-color:var(--line);color:var(--muted)}
.pill[aria-pressed="true"],.pill[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill:active{transform:scale(.97)}

/* герой */
.hero{padding-block:8px 26px;display:flex;flex-direction:column;gap:12px}
.hero h1{margin:0;font-size:clamp(46px,15vw,104px)}
.hero .serif{font-size:clamp(24px,7vw,40px);line-height:1}
.hero p{margin:0;max-width:44ch;font-size:14px;color:var(--muted);font-weight:500}

/* обложка */
.cover{position:relative;border-radius:20px;overflow:hidden;background:var(--ink);color:#fff;aspect-ratio:1/1;max-width:100%;display:flex;flex-direction:column}
.cover.wide{aspect-ratio:4/3}
@media (min-width:620px){.cover{aspect-ratio:16/10}.cover.wide{aspect-ratio:16/9}}
.cover .art{position:absolute;inset:0;pointer-events:none}
.cover .art b{position:absolute;right:.04em;bottom:-.12em;font-weight:900;font-size:clamp(220px,62vw,440px);line-height:1;letter-spacing:-.08em;color:#222;text-transform:uppercase}
.cover .grain{position:absolute;inset:0;background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.08),transparent 60%)}
.cover-text{position:relative;z-index:1;padding:18px;display:flex;flex-direction:column;gap:6px}
.cover-text .mono{color:rgba(255,255,255,.75)}
.cover-text .heavy{font-size:clamp(34px,11vw,64px);overflow-wrap:anywhere}
.cover-text .serif{font-size:clamp(18px,5.4vw,28px);line-height:1}
.cover-foot{position:relative;z-index:1;margin-top:auto;padding:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.cover-foot .mono{color:rgba(255,255,255,.75)}
.round{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none}
.round svg{width:18px;height:18px;margin-left:3px}

/* переключатель */
.kinds{display:flex;gap:16px;align-items:baseline;padding-top:34px}
.kinds button{background:none;border:0;padding:0;cursor:pointer;font-weight:800;text-transform:uppercase;letter-spacing:-.05em;line-height:.86;font-size:clamp(40px,12vw,72px);color:var(--pale);transition:color .3s}
.kinds button[aria-pressed="true"]{color:var(--ink)}
.kinds sup{font:400 11px/1 var(--mono);letter-spacing:.04em;vertical-align:top;margin-left:2px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding-block:16px}
.find{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-width:0;flex:1 1 160px;background:var(--surface)}
.find input{border:0;background:none;outline:none;width:100%;min-width:0;font:400 12px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.find input::placeholder{color:var(--muted)}

/* список, как расписание эфира */
.slist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.srow{border-bottom:1px solid var(--line)}
.sline{display:grid;grid-template-columns:5.4em minmax(0,1fr) auto;align-items:baseline;gap:8px;padding:10px 0;font-size:10px;color:var(--ink);transition:color .3s}
.slist:hover .sline{color:var(--pale)}
.slist .sline:hover{color:var(--ink)}
.sline .d{font:400 10px/1.25 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sline .n{font-weight:800;font-size:min(8.5vw,44px);letter-spacing:-.055em;line-height:.86;text-transform:uppercase;overflow-wrap:anywhere}
.sline .r{font:500 11px/1 var(--mono);color:var(--muted)}
.sample{display:inline-block;margin-top:4px;padding:2px 6px;border:1px solid var(--line);border-radius:999px;font:400 9px/1.2 var(--mono);letter-spacing:.04em;color:var(--muted)}
.empty{padding:28px 0;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}

.sec{display:flex;flex-direction:column;gap:12px;padding-top:30px}
.sec h2{margin:0;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:-.05em}

/* карточка проекта */
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px}
.item{display:flex;flex-direction:column;gap:22px;padding-bottom:30px}
.item-h{display:flex;flex-direction:column;gap:8px}
.item-h h1{margin:0;font-size:clamp(46px,14vw,92px)}
.item-h .serif{font-size:clamp(22px,6vw,32px);line-height:1}
.facts{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.facts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.facts li span:first-child{font:400 10px/1.25 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts li b{font-weight:800;font-size:22px;letter-spacing:-.04em;text-transform:uppercase}
.desc{margin:0;font-size:16px;line-height:1.5;font-weight:500;max-width:56ch}
.quote{margin:0;padding:18px;background:var(--surface);border-radius:20px;display:flex;flex-direction:column;gap:10px}
.quote p{margin:0;font-family:var(--serif);font-style:italic;font-size:clamp(20px,5.4vw,26px);line-height:1.15}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nums div{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nums b{font-weight:800;font-size:clamp(24px,7vw,36px);letter-spacing:-.05em;line-height:.9}
.rules{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.rules li{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.rules li span{font:400 10px/1.25 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rules li b{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;font-size:clamp(18px,5vw,24px);line-height:.95}
.cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:3;padding-top:10px;background:linear-gradient(transparent,var(--bg) 40%)}
.btn{flex:1;height:54px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.btn.ghost{flex:0 0 auto;padding:0 20px;background:var(--bg);color:var(--ink)}
.btn[aria-disabled="true"]{background:var(--surface);border-color:var(--line);color:var(--muted);cursor:default}
.btn:active{transform:scale(.98)}

/* страницы */
.page{display:flex;flex-direction:column;gap:18px;padding-bottom:36px}
.page h1{margin:0;font-size:clamp(46px,14vw,92px)}
.page .serif{font-size:clamp(22px,6vw,32px);line-height:1}
.page .lead{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
form{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--ink);padding-top:16px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font:400 10px/1.25 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f textarea,.f select{border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0 10px;outline:none;border-radius:0;font-weight:700;font-size:20px;letter-spacing:-.03em}
.f input::placeholder{color:var(--pale)}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--ink)}
.f textarea{min-height:80px;resize:vertical;font-weight:500;font-size:16px;letter-spacing:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink);cursor:pointer}
.agree input{appearance:none;flex:none;width:20px;height:20px;border:1px solid var(--ink);border-radius:50%;margin:0;display:grid;place-items:center;cursor:pointer}
.agree input:checked{background:var(--ink)}
.agree input:checked::after{content:"";width:8px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.msg{font:400 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.04em}
.msg.err{color:#d0342c}
.done{background:var(--surface);border-radius:20px;padding:26px 18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.done h2{margin:0;font-size:clamp(34px,10vw,56px)}

.foot{border-top:1px solid var(--ink);padding-block:16px 30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}
.loading{min-height:60vh;display:grid;place-items:center}
.loading b{font-size:22px;font-weight:800;letter-spacing:-.05em;text-transform:uppercase;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.in{animation:in .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <a class="station" href="#">BOX APPS</a>
    <span class="badge" id="count"><i></i>в каталоге</span>
  </header>
  <nav class="nav" aria-label="Разделы">
    <a class="pill" href="#" data-nav="">Каталог</a>
    <a class="pill" href="#rules" data-nav="rules">Правила</a>
    <a class="pill" href="#submit" data-nav="submit">Предложить</a>
  </nav>

  <main id="app"><div class="loading"><b>BOX APPS</b></div></main>

  <footer class="foot">
    <span class="mono muted">© BOX APPS · отобрано вручную</span>
    <a class="mono" id="botlink" href="#" hidden>Бот в Telegram →</a>
  </footer>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); } catch (e) {} }

const S = { data: null, kind: 'game', cat: 'all', q: '' };
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const kindName = k => k === 'bot' ? 'Бот' : 'Игра';
const haptic = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
const PLAY = '<svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg>';
const indexOf = x => S.data.items.indexOf(x) + 1;

function cover(x, opts = {}) {
  const g = x.title.replace(/[«»"]/g, '').trim()[0] || '·';
  return `<div class="cover ${opts.wide ? 'wide' : ''}">
    <div class="art"><div class="grain"></div><b>${esc(g)}</b></div>
    <div class="cover-text">
      <span class="mono">${esc(opts.label || kindName(x.kind) + ' · № ' + pad(indexOf(x)))}</span>
      ${opts.bare ? '' : `<span class="heavy">${esc(x.title)}</span>`}
      ${x.author ? `<span class="serif">${esc(x.author)}</span>` : ''}
    </div>
    <div class="cover-foot">
      <span class="mono">${esc(x.categories.join(' · '))}${x.rating ? ' · ' + Number(x.rating).toFixed(1) : ''}</span>
      ${opts.play ? `<span class="round">${PLAY}</span>` : ''}
    </div>
  </div>`;
}

function home() {
  const all = S.data.items;
  const games = all.filter(x => x.kind === 'game').length, bots = all.length - games;
  const pick = all.find(x => x.featured && x.kind === S.kind) || all.find(x => x.kind === S.kind);
  const q = S.q.trim().toLowerCase();
  let list = all.filter(x => x.kind === S.kind);
  if (S.cat !== 'all') list = list.filter(x => x.categories.includes(S.cat));
  if (q) list = all.filter(x => (x.title + ' ' + (x.description || '')).toLowerCase().includes(q));
  list = [...list].sort((a, b) => (b.rating || 0) - (a.rating || 0));
  const cats = S.data.categories[S.kind];

  app.innerHTML = `
  <section class="hero in">
    <h1 class="heavy">Игры<br>и боты</h1>
    <span class="serif">отобранные вручную</span>
    <p>Каждый проект мы открываем сами. Тапалки, казино, «заработок» и обязательные подписки сюда не попадают.</p>
  </section>

  ${pick && !q && S.cat === 'all' ? `<a href="#item-${pick.id}" class="in" style="display:block">${cover(pick, { label: 'Выбор редакции', play: true })}</a>` : ''}

  <div class="kinds" role="group" aria-label="Раздел">
    <button data-kind="game" aria-pressed="${S.kind === 'game'}">Игры<sup>${games}</sup></button>
    <button data-kind="bot" aria-pressed="${S.kind === 'bot'}">Боты<sup>${bots}</sup></button>
  </div>

  <div class="filters" role="group" aria-label="Категории">
    <button class="pill" data-cat="all" aria-pressed="${S.cat === 'all'}">Все</button>
    ${cats.map(c => `<button class="pill" data-cat="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join('')}
    <button class="pill soft" id="rnd">Случайно ↻</button>
    <label class="find"><input id="q" type="search" placeholder="Поиск" value="${esc(S.q)}" autocomplete="off" aria-label="Поиск по названию"></label>
  </div>

  <ul class="slist">
    ${list.length ? list.map(x => `
      <li class="srow"><a class="sline" href="#item-${x.id}">
        <span class="d">№ ${pad(indexOf(x))}<br>${esc(x.categories[0])}${x.example ? '<br><span class="sample">образец</span>' : ''}</span>
        <span class="n">${esc(x.title)}</span>
        <span class="r">${x.rating ? Number(x.rating).toFixed(1) : ''}</span>
      </a></li>`).join('') : `<li class="empty">Здесь пока пусто. <a href="#submit"><u>Предложите проект</u></a></li>`}
  </ul>`;

  app.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { S.kind = b.dataset.kind; S.cat = 'all'; S.q = ''; haptic(); home(); });
  app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; haptic(); home(); });
  app.querySelector('#rnd').onclick = () => { const pool = all.filter(x => x.kind === S.kind); haptic(); location.hash = 'item-' + pool[Math.floor(Math.random() * pool.length)].id; };
  const qi = app.querySelector('#q');
  qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; home(); const n = app.querySelector('#q'); n.focus(); n.setSelectionRange(pos, pos); };
}

function item(id) {
  const x = S.data.items.find(i => i.id === id);
  if (!x) { app.innerHTML = `<section class="page"><h1 class="heavy">Нет такого</h1><span class="serif">проект убрали из каталога</span><a class="btn" href="#" style="flex:none">В каталог</a></section>`; return; }
  const st = x.stats;
  app.innerHTML = `
  <div class="top"><button class="pill" onclick="history.length>1?history.back():location.hash=''">← Назад</button>${x.example ? '<span class="pill soft">образец</span>' : ''}</div>
  <article class="item in">
    ${cover(x, { wide: true, bare: true })}
    <div class="item-h">
      <span class="mono muted">${kindName(x.kind)} · ${esc(x.categories.join(' · '))}</span>
      <h1 class="heavy">${esc(x.title)}</h1>
      ${x.note ? `<span class="serif">${esc(x.note)}</span>` : ''}
    </div>
    <ul class="facts">
      <li><span>Оценка</span><b>${x.rating ? Number(x.rating).toFixed(1) : '—'}${x.votes ? ` <span class="mono muted">/ ${x.votes}</span>` : ''}</b></li>
      ${x.kind === 'game' ? `<li><span>Сессия</span><b>${x.session ? '~' + esc(x.session) : '—'}</b></li>` : ''}
      <li><span>Цена</span><b>Бесплатно</b></li>
      <li><span>Проверка</span><b>Пройдена ●</b></li>
    </ul>
    <p class="desc">${esc(x.description)}</p>
    ${st ? `<div class="sec" style="padding-top:0"><span class="mono muted">Показатели за 30 дней${x.example ? ' · пример' : ''}</span>
      <div class="nums">
        <div><span class="mono muted">Игроков</span><b>${esc(st.players)}</b></div>
        <div><span class="mono muted">Сессия</span><b>${esc(st.session)}</b></div>
        <div><span class="mono muted">Вернулись</span><b>${esc(st.d7)}</b></div>
      </div></div>` : ''}
    <div class="sec" style="padding-top:0"><h2>Правила отбора</h2>
      <ul class="rules">${S.data.criteria.map((c, i) => `<li><span>Правило ${i + 1}</span><b>${esc(c)}</b></li>`).join('')}</ul></div>
    <div class="cta">
      ${x.link ? `<a class="btn" href="${esc(x.link)}" target="_blank" rel="noopener" id="open">${x.kind === 'bot' ? 'Открыть бота' : 'Играть'} →</a>`
               : `<span class="btn" aria-disabled="true">Ссылка скоро</span>`}
      <button class="btn ghost" id="share">Поделиться</button>
    </div>
  </article>`;
  const open = app.querySelector('#open');
  if (open && tg) open.onclick = e => { e.preventDefault(); try { tg.openTelegramLink(x.link); } catch (er) { location.href = x.link; } };
  app.querySelector('#share').onclick = async () => {
    const url = location.origin + '/#item-' + x.id;
    if (tg) { try { tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(x.title + ' — в каталоге BOX APPS')); return; } catch (e) {} }
    try { await navigator.clipboard.writeText(url); app.querySelector('#share').textContent = 'Скопировано'; } catch (e) {}
  };
}

function rules() {
  app.innerHTML = `<section class="page in">
    <h1 class="heavy">Четыре<br>правила</h1>
    <span class="serif">без исключений</span>
    <p class="lead">Каждым проектом в каталоге мы пользуемся сами хотя бы неделю. Платное размещение возможно только для тех, кто уже прошёл отбор, и всегда с пометкой.</p>
    <ul class="rules">${S.data.criteria.map((c, i) => `<li><span>Правило ${i + 1}</span><b>${esc(c)}</b></li>`).join('')}</ul>
    <a class="btn" href="#submit" style="flex:none">Предложить проект →</a>
  </section>`;
}

function submit() {
  let kind = 'game';
  const catOpts = k => S.data.categories[k].map(c => `<option>${esc(c)}</option>`).join('');
  app.innerHTML = `<section class="page in">
    <h1 class="heavy">Предложить</h1>
    <span class="serif">игру или бота</span>
    <p class="lead">Мы посмотрим каждую заявку и сами всё попробуем. Ответ придёт в течение недели.</p>
    <form id="f" novalidate>
      <div class="row" role="group" aria-label="Что это"><button type="button" class="pill" data-k="game" aria-pressed="true">Игра</button><button type="button" class="pill" data-k="bot" aria-pressed="false">Бот</button></div>
      <div class="f"><label for="f-title">Название</label><input id="f-title" maxlength="64" placeholder="Тихий маяк" required></div>
      <div class="f"><label for="f-link">Ссылка</label><input id="f-link" placeholder="t.me/имя_бота" required></div>
      <div class="f"><label for="f-cat">Категория</label><select id="f-cat">${catOpts('game')}</select></div>
      <div class="f"><label for="f-desc">Пара строк о проекте</label><textarea id="f-desc" maxlength="600"></textarea></div>
      <div class="f"><label for="f-contact">Как с вами связаться</label><input id="f-contact" placeholder="@username" maxlength="64"></div>
      <label class="agree"><input type="checkbox" id="f-ok">Проект проходит все четыре правила: без токенов и «заработка», без казино, без обязательных подписок, интересен дольше пяти минут.</label>
      <p class="msg" id="f-msg" hidden></p>
      <button class="btn" type="submit">Отправить на проверку →</button>
    </form>
  </section>`;
  const f = app.querySelector('#f');
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.username) f.querySelector('#f-contact').value = '@' + tg.initDataUnsafe.user.username;
  f.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { kind = b.dataset.k; f.querySelectorAll('[data-k]').forEach(x => x.setAttribute('aria-pressed', x === b)); f.querySelector('#f-cat').innerHTML = catOpts(kind); });
  f.onsubmit = async e => {
    e.preventDefault();
    const msg = f.querySelector('#f-msg'); msg.hidden = true; msg.className = 'msg';
    const body = { kind, title: f.querySelector('#f-title').value, link: f.querySelector('#f-link').value, category: f.querySelector('#f-cat').value,
      description: f.querySelector('#f-desc').value, contact: f.querySelector('#f-contact').value, criteria: f.querySelector('#f-ok').checked };
    const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Отправляем…';
    try {
      const r = await fetch('/api/submit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'Не получилось отправить');
      app.querySelector('.page').innerHTML = `<div class="done in"><span class="mono muted">Заявка принята</span><h2 class="heavy">Спасибо</h2><span class="serif" style="font-size:22px">редакция ответит в течение недели</span><a class="btn" href="#" style="flex:none;padding:0 22px">В каталог</a></div>`;
    } catch (err) {
      msg.textContent = err.message === 'Failed to fetch' ? 'Нет соединения. Попробуйте ещё раз.' : err.message;
      msg.classList.add('err'); msg.hidden = false; btn.disabled = false; btn.textContent = 'Отправить на проверку →';
    }
  };
}

function route() {
  if (!S.data) return;
  const h = location.hash.slice(1);
  const navKey = h.startsWith('item-') ? '' : h;
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === navKey ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (h.startsWith('item-')) item(h.slice(5));
  else if (h === 'rules') rules();
  else if (h === 'submit') submit();
  else home();
  if (tg) { try { h ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
  window.scrollTo(0, 0);
}

async function boot() {
  try {
    const r = await fetch('/api/catalog');
    S.data = await r.json();
  } catch (e) {
    app.innerHTML = `<div class="loading"><span class="mono muted">Каталог не загрузился. Обновите страницу.</span></div>`;
    return;
  }
  document.getElementById('count').innerHTML = `<i></i>${S.data.items.length} в каталоге`;
  if (S.data.bot) { const a = document.getElementById('botlink'); a.href = 'https://t.me/' + S.data.bot; a.hidden = false; }
  if (tg) { try { tg.BackButton.onClick(() => history.length > 1 ? history.back() : (location.hash = '')); } catch (e) {} }
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && !location.hash) location.hash = sp.startsWith('item-') ? sp : 'item-' + sp;
  route();
}
window.addEventListener('hashchange', route);
boot();
</script>
</body>
</html>
